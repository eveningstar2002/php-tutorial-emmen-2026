<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A form</title>
</head>
<body>
<form action="process.php" method="post">
    <label for="name">Name:</label>
    <input type="text"
           id="name" name="name"
           minlength="5" maxlength="30"
           size="30">
    <br>
    <label for="surname">Surname:</label>
    <input type="text" id="surname"
           name="surname"
           maxlength="25" size="25">
    <br>
    <button type="submit">save!</button>
</form>
</body>
</html>
